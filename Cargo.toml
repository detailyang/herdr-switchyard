[package]
name = "herdr-switchyard"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A project and worktree session switcher for Herdr"
repository = "https://github.com/detailyang/herdr-switchyard"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
dirs = "6.0"
fs2 = "0.4"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
strip = true
lto = "thin"
